name: conflict_interface check new version

on:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths:
      - "libs/conflict_interface/conflict_interface/data_types/newest/version.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  check-new-version:
    runs-on: ubuntu-latest
    env:
      TEST_ACCOUNT_USERNAME: ${{ secrets.TEST_ACCOUNT_USERNAME }}
      TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
      TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
      TEST_PROXY_URL: ${{ secrets.TEST_PROXY_URL }}
      CONFLICT_DATA_TOKEN: ${{ secrets.CONFLICT_DATA_PUSH_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout ConflictInterface
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ConflictInterface
        working-directory: libs/conflict_interface
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check for new client version
        id: check_version
        run: |
          python scripts/check_new_version.py > script_output.txt

          RAW_OUTPUT=$(tail -n 1 script_output.txt)
          python - "$RAW_OUTPUT" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          print(f"client_version={d['client_version']}")
          print(f"supported_version={d['supported_version']}")
          print(f"needs_version_data={str(d['needs_version_data']).lower()}")
          PY

      - name: Publish version badges
        env:
          CLIENT_VERSION: ${{ steps.check_version.outputs.client_version }}
          SUPPORTED_VERSION: ${{ steps.check_version.outputs.supported_version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # main is pull-request-only, so the badges live on their own `badges` branch:
          # a content-only orphan commit holding just the two JSON files at the root.
          BADGE_DIR="$RUNNER_TEMP/badges"
          python scripts/write_version_badges.py \
            --out-dir "$BADGE_DIR" \
            --client-version "$CLIENT_VERSION" \
            --supported-version "$SUPPORTED_VERSION"

          # Skip the push when neither number moved; the branch keeps its current commit.
          if git fetch --depth=1 origin badges 2>/dev/null \
            && git show FETCH_HEAD:supported-client.json | cmp -s - "$BADGE_DIR/supported-client.json" \
            && git show FETCH_HEAD:latest-client.json | cmp -s - "$BADGE_DIR/latest-client.json"; then
            echo "Badges already up to date; nothing to publish."
            exit 0
          fi

          # Assemble the commit with plumbing so the checkout itself is left untouched.
          # git mktree wants the entries sorted by name, hence latest- before supported-.
          blob_supported=$(git hash-object -w "$BADGE_DIR/supported-client.json")
          blob_latest=$(git hash-object -w "$BADGE_DIR/latest-client.json")
          tree=$(printf '100644 blob %s\t%s\n100644 blob %s\t%s\n' \
                   "$blob_latest" latest-client.json \
                   "$blob_supported" supported-client.json | git mktree)
          commit=$(git commit-tree "$tree" \
            -m "Update client version badges (supported v${SUPPORTED_VERSION}, live v${CLIENT_VERSION})")
          git push --force origin "$commit:refs/heads/badges"

      - name: Stop if there was no new version
        if: steps.check_version.outputs.needs_version_data != 'true'
        run: echo "No new client version; nothing to do."

      - name: Trigger create-version-data workflow
        if: steps.check_version.outputs.needs_version_data == 'true'
        run: |
          gh workflow run conflict_interface-create-version-data.yml \
            -f version="${{ steps.check_version.outputs.client_version }}"
